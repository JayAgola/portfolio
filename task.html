<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>365 Task Tracker</title>
    <!-- Chart.js for progress graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #f69206; /* Matching your portfolio theme */
            --bg-color: #f4f7f6;
            --text-main: #333;
            --card-bg: #fff;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        /* Password Overlay Styles */
        #password-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #262626;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .password-box {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .password-box input {
            padding: 10px;
            margin: 10px 0;
            width: 80%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .password-box button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* App Styles */
        #app-content { display: none; }
        .container { max-width: 800px; margin: auto; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .stat-card h3 { margin: 0; color: var(--primary); font-size: 24px; }
        .stat-card p { margin: 5px 0 0; font-size: 12px; color: #666; text-transform: uppercase; }
        
        .chart-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .task-list { list-style: none; padding: 0; }
        .task-item {
            background: var(--card-bg);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            border-left: 4px solid var(--primary);
        }
        .task-item.completed { opacity: 0.6; }
        .task-item.completed .text { text-decoration: line-through; }
        .task-item input { margin-right: 15px; width: 20px; height: 20px; accent-color: var(--primary); }
        .task-points { margin-left: auto; font-size: 12px; font-weight: bold; color: var(--primary); background: #fff3e0; padding: 3px 8px; border-radius: 10px;}
        
        .btn {
            background: #262626; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- PASSWORD GATE -->
    <div id="password-overlay">
        <div class="password-box">
            <h2>Authorized Access Only</h2>
            <input type="password" id="pass-input" placeholder="Enter Password">
            <br>
            <button onclick="checkPassword()">Unlock Dashboard</button>
            <p id="error-msg" style="color: red; display: none; font-size: 12px;">Incorrect Password</p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-content" class="container">
        <h1 style="text-align: center;">Mission 365 Dashboard</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="current-day">1</h3>
                <p>Current Day</p>
            </div>
            <div class="stat-card">
                <h3 id="today-score">0 / 100</h3>
                <p>Today's Score</p>
            </div>
            <div class="stat-card">
                <h3 id="total-score">0</h3>
                <p>Total Accumulative Score</p>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="progressChart"></canvas>
        </div>

        <h2>Today's Mission (Day <span id="mission-day">1</span>)</h2>
        <ul class="task-list" id="task-list">
            <!-- Tasks load here -->
        </ul>

        <button class="btn" onclick="advanceDay()">Complete Day & Sync Data</button>
        <br><br>
        <a href="index.html" style="color: #666; text-decoration: none; font-size: 14px;">&larr; Back to Portfolio</a>
    </div>

    <script>
        // --- 1. SECURITY LOGIC ---
        const SECRET_PASS = "Jay@2026"; // Change this to your desired password

        function checkPassword() {
            const input = document.getElementById('pass-input').value;
            if (input === SECRET_PASS) {
                document.getElementById('password-overlay').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                initApp();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        // --- 2. DATA STRUCTURE ---
        // Tasks definition (Add all 365 days here)
        const allTasks = [
            { id: 1, day: 1, text: "Define daily goals" },
            { id: 2, day: 1, text: "Read 10 pages" },
            { id: 3, day: 1, text: "Code for 1 hour" }, // Day 1 = 3 tasks (33.3 pts each)
            { id: 4, day: 2, text: "Exercise 30 mins" },
            { id: 5, day: 2, text: "Update GitHub portfolio" }, // Day 2 = 2 tasks (50 pts each)
            { id: 6, day: 3, text: "Review weekly progress" } // Day 3 = 1 task (100 pts each)
        ];

        // --- 3. STATE MANAGEMENT ---
        let currentDay = parseInt(localStorage.getItem('taskApp_day')) || 1;
        let completedTaskIds = JSON.parse(localStorage.getItem('taskApp_completed')) || [];
        let dailyHistory = JSON.parse(localStorage.getItem('taskApp_history')) || {};
        let myChart = null;

        const MAX_SCORE_PER_DAY = 100;

        function initApp() {
            renderDashboard();
            renderChart();
        }

        // --- 4. CORE LOGIC ---
        function toggleTask(taskId) {
            if (completedTaskIds.includes(taskId)) {
                completedTaskIds = completedTaskIds.filter(id => id !== taskId);
            } else {
                completedTaskIds.push(taskId);
            }
            saveState();
            renderDashboard();
            updateChartData();
        }

        function saveState() {
            localStorage.setItem('taskApp_day', currentDay);
            localStorage.setItem('taskApp_completed', JSON.stringify(completedTaskIds));
            
            // Save today's final score to history
            const todayTasks = allTasks.filter(t => t.day === currentDay);
            const scorePerTask = todayTasks.length > 0 ? MAX_SCORE_PER_DAY / todayTasks.length : 0;
            const completedToday = todayTasks.filter(t => completedTaskIds.includes(t.id)).length;
            const todayScore = Math.round(completedToday * scorePerTask);
            
            dailyHistory[currentDay] = todayScore;
            localStorage.setItem('taskApp_history', JSON.stringify(dailyHistory));
        }

        function advanceDay() {
            saveState(); // Ensure today is saved
            currentDay++;
            localStorage.setItem('taskApp_day', currentDay);
            renderDashboard();
            updateChartData();
        }

        // --- 5. UI RENDERING ---
        function renderDashboard() {
            document.getElementById('current-day').innerText = currentDay;
            document.getElementById('mission-day').innerText = currentDay;
            
            const taskList = document.getElementById('task-list');
            taskList.innerHTML = '';

            // Get tasks up to current day that are incomplete, PLUS all of today's tasks
            const activeTasks = allTasks.filter(t => 
                (t.day === currentDay) || (t.day < currentDay && !completedTaskIds.includes(t.id))
            );

            let todayTotalEarned = 0;
            let grandTotalScore = 0;

            // Calculate historical total score
            for (let d = 1; d < currentDay; d++) {
                if (dailyHistory[d]) grandTotalScore += dailyHistory[d];
            }

            activeTasks.forEach(task => {
                // Calculate points dynamically based on how many tasks were assigned to that specific day
                const tasksForThisDay = allTasks.filter(t => t.day === task.day).length;
                const pointsValue = Math.round(MAX_SCORE_PER_DAY / tasksForThisDay);
                
                const isCompleted = completedTaskIds.includes(task.id);
                
                if (isCompleted && task.day === currentDay) {
                    todayTotalEarned += pointsValue;
                }

                const li = document.createElement('li');
                li.className = `task-item ${isCompleted ? 'completed' : ''}`;
                li.innerHTML = `
                    <input type="checkbox" ${isCompleted ? 'checked' : ''} onchange="toggleTask(${task.id})">
                    <span class="text">${task.text} ${task.day < currentDay ? '<b style="color:red">(Overdue Day '+task.day+')</b>' : ''}</span>
                    <span class="task-points">${pointsValue} pts</span>
                `;
                taskList.appendChild(
                    li);
            });

            grandTotalScore += todayTotalEarned;
            
            document.getElementById('today-score').innerText = `${todayTotalEarned} / 100`;
            document.getElementById('total-score').innerText = grandTotalScore;
        }

        // --- 6. CHART.JS INTEGRATION ---
        function renderChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            
            const labels = [];
            const data = [];
            
            for (let i = 1; i <= currentDay; i++) {
                labels.push(`Day ${i}`);
                data.push(dailyHistory[i] || 0); // Default to 0 if no history
            }

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Daily Score',
                        data: data,
                        borderColor: '#f69206',
                        backgroundColor: 'rgba(246, 146, 6, 0.2)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, max: 100 }
                    }
                }
            });
        }

        function updateChartData() {
            if (!myChart) return;
            const labels = [];
            const data = [];
            for (let i = 1; i <= currentDay; i++) {
                labels.push(`Day ${i}`);
                data.push(dailyHistory[i] || 0);
            }
            myChart.data.labels = labels;
            myChart.data.datasets[0].data = data;
            
            // Inject current day's active score into the graph instantly
            const todayTasks = allTasks.filter(t => t.day === currentDay);
            const scorePerTask = todayTasks.length > 0 ? MAX_SCORE_PER_DAY / todayTasks.length : 0;
            const completedToday = todayTasks.filter(t => completedTaskIds.includes(t.id)).length;
            myChart.data.datasets[0].data[currentDay - 1] = Math.round(completedToday * scorePerTask);

            myChart.update();
        }
    </script>
</body>
</html>
